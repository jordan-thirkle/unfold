name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # The gate. These checks are framework-free and always execute.
      - name: Verify the deterministic core
        run: swift run unfold-verify

      # Require execution evidence, not just a successful build/exit status.
      # XCTest's separate zero-test summary is not a Swift Testing result.
      - name: Swift Testing suites
        shell: bash
        run: |
          set -euo pipefail
          swift test --enable-swift-testing --disable-xctest 2>&1 | tee swift-testing.log
          if ! grep -Eq 'Test run with [1-9][0-9]* tests? passed' swift-testing.log; then
            echo '::error::Swift Testing did not report a successful nonzero test count.'
            exit 1
          fi
