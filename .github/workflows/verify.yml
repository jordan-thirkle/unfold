name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      # The gate. These checks are framework-free and always execute.
      - name: Verify the deterministic core
        run: swift run unfold-verify

      # Informational only. On a Command Line Tools-only machine `swift test`
      # builds the bundle and exits 0 without running anything, because
      # XCTest was removed in CLT 26.x and SPM's generated runner falls back
      # to the XCTest path. GitHub's macOS runners have a full Xcode install,
      # so it does run here — but it is deliberately not the gate.
      - name: Swift Testing suites
        run: swift test
